name: upstream-compatibility

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  node-lanes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve reviewed floor Node
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          floor="$(node -e "const f=require('./ci/node-lanes.json');process.stdout.write(f.floor)")"
          case "$floor" in *[!0-9.]*|'') exit 1 ;; esac
          printf 'floor=%s\n' "$floor" >> "$GITHUB_OUTPUT"
      - name: Install floor Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.lane.outputs.floor }}
      - name: Blocking release lane freshness
        if: github.event_name == 'workflow_call'
        run: node scripts/check-node-lanes.mjs --online
      - name: Scheduled lane-drift report
        id: drift
        if: github.event_name != 'workflow_call'
        shell: bash
        run: |
          set +e
          node scripts/check-node-lanes.mjs --online >node-lane-report.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' 'NODE_LANES_STALE' >> "$GITHUB_STEP_SUMMARY"
            printf 'status=stale\n' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'Node lanes are current.' >> "$GITHUB_STEP_SUMMARY"
            printf 'status=current\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload bounded drift evidence
        if: github.event_name != 'workflow_call' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-lane-drift-${{ github.sha }}
          path: node-lane-report.txt
          if-no-files-found: error
          retention-days: 7
